name: ironlog
description: "IronLog - Offline-first premium gym logging app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0
  drift: ^2.24.2
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  fl_chart: ^0.70.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  shared_preferences: ^2.3.5
  intl: ^0.20.2
  uuid: ^4.5.1
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  sensors_plus: ^6.1.1
  local_auth: ^2.3.0
  speech_to_text: ^7.0.0
  vector_math: ^2.1.4
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.2
  flutter_animate: ^4.5.2
  skeletonizer: ^3.0.0
  google_fonts: ^8.2.1
  http: ^1.2.2
  flutter_markdown: ^0.7.7+1
  image_picker: ^1.2.3
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.24.2
  build_runner: ^2.4.15
  test: ^1.26.3

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/exercises/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
